{% extends "accounts/coe_base.html" %}

{% block title %}
Add Examination Semester Mapping
{% endblock %}

{% block page_content %}

<h2>Add Examination Semester Mapping</h2>

<hr>

<form method="post">

    {% csrf_token %}

    {{ form.as_p }}

    <button
        type="submit"
        class="btn btn-primary">

        Save

    </button>

    <a href="{% url 'examination_semester_list' %}"
       class="btn btn-secondary">

        Cancel

    </a>

</form>

{% endblock %}
